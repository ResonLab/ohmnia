name: Construire et publier

# Deux façons de lancer ce travail :
#
#   1. À la main, depuis l'onglet « Actions » du dépôt : les installeurs sont
#      construits et déposés en pièces jointes du travail, sans rien publier.
#      C'est ce qu'il faut pour tester une construction Linux sans risque.
#
#   2. En poussant une étiquette de version (`git tag v0.2.0 && git push --tags`) :
#      une *release* est créée sur GitHub, en BROUILLON. Elle reste invisible
#      tant que vous n'avez pas cliqué « Publish release » vous-même.
#
# Aucun jeton d'accès à créer : GitHub en fournit un au travail, valable
# uniquement pour ce dépôt et le temps de l'exécution.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  construire:
    strategy:
      # Si Linux échoue, on veut quand même savoir si Windows passe.
      fail-fast: false
      matrix:
        include:
          - systeme: windows-latest
            cible: --win
            nom: windows
          - systeme: ubuntu-latest
            cible: --linux
            nom: linux

    runs-on: ${{ matrix.systeme }}
    name: ${{ matrix.nom }}

    steps:
      - uses: actions/checkout@v7

      # Node 24 : `node:sqlite` est un module intégré, il n'existe pas avant.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Rien ne doit être publié si les vérifications ne passent pas.
      - name: Vérifier
        run: npm run verifier

      # Le paquet .deb est fabriqué avec fakeroot, que l'image Ubuntu 24.04 des
      # runners ne fournit plus. Sans lui, la construction du .deb échoue en
      # quelques secondes, alors que l'AppImage passe très bien.
      - name: Installer les outils de paquetage Debian
        if: ${{ matrix.nom == 'linux' }}
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Compiler l'application
        run: npx electron-vite build

      # Les cibles sont construites séparément : si le paquet .deb échoue, on
      # veut quand même savoir si l'AppImage est passé, et l'inverse.
      - name: Construire l'AppImage
        if: ${{ matrix.nom == 'linux' && !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --linux AppImage --publish never
        env:
          DEBUG: electron-builder

      - name: Construire le paquet .deb
        if: ${{ matrix.nom == 'linux' && !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --linux deb --publish never
        env:
          DEBUG: electron-builder

      - name: Construire sans publier
        if: ${{ matrix.nom == 'windows' && !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder ${{ matrix.cible }} --publish never

      # Dit noir sur blanc ce qui a ete produit, meme quand une cible a echoue.
      - name: Lister ce qui a été produit
        if: always()
        shell: bash
        run: ls -la release/ 2>/dev/null || echo 'aucun dossier release/'

      # Le guide en PDF, joint a la release : on installe le logiciel sur une
      # machine sans navigateur ouvert a cote. Sur Linux seulement.
      - name: Produire le guide en PDF
        if: ${{ matrix.nom == 'linux' }}
        run: |
          node scripts/publier-guide.mjs
          xvfb-run --auto-servernum npx electron scripts/guide-pdf.mjs

      - name: Construire et déposer la release (brouillon)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder ${{ matrix.cible }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Les installeurs restent téléchargeables depuis la page du travail
      # pendant 14 jours, même sans release.
      - name: Joindre les installeurs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ohmnia-${{ matrix.nom }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
            release/*guide*.pdf
