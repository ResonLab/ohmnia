name: Construire et publier

# Deux façons de lancer ce travail :
#
#   1. À la main, depuis l'onglet « Actions » du dépôt : les installeurs sont
#      construits et déposés en pièces jointes du travail, sans rien publier.
#      C'est ce qu'il faut pour tester une construction Linux sans risque.
#
#   2. En poussant une étiquette de version (`git tag v0.2.0 && git push --tags`) :
#      une *release* est créée sur GitHub, en BROUILLON. Elle reste invisible
#      tant que vous n'avez pas cliqué « Publish release » vous-même.
#
# Aucun jeton d'accès à créer : GitHub en fournit un au travail, valable
# uniquement pour ce dépôt et le temps de l'exécution.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  construire:
    strategy:
      # Si Linux échoue, on veut quand même savoir si Windows passe.
      fail-fast: false
      matrix:
        include:
          - systeme: windows-latest
            cible: --win
            nom: windows
          - systeme: ubuntu-latest
            cible: --linux
            nom: linux

    runs-on: ${{ matrix.systeme }}
    name: ${{ matrix.nom }}

    steps:
      - uses: actions/checkout@v7

      # Node 24 : `node:sqlite` est un module intégré, il n'existe pas avant.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Rien ne doit être publié si les vérifications ne passent pas.
      - name: Vérifier
        run: npm run verifier

      # Le paquet .deb est fabriqué avec fakeroot, que l'image Ubuntu 24.04 des
      # runners ne fournit plus. Sans lui, la construction du .deb échoue en
      # quelques secondes, alors que l'AppImage passe très bien.
      - name: Installer les outils de paquetage Debian
        if: ${{ matrix.nom == 'linux' }}
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Compiler l'application
        run: npx electron-vite build

      # Les cibles sont construites séparément : si le paquet .deb échoue, on
      # veut quand même savoir si l'AppImage est passé, et l'inverse.
      - name: Construire l'AppImage
        if: ${{ matrix.nom == 'linux' && !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --linux AppImage --publish never
        env:
          DEBUG: electron-builder

      - name: Construire le paquet .deb
        if: ${{ matrix.nom == 'linux' && !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --linux deb --publish never
        env:
          DEBUG: electron-builder

      - name: Construire sans publier
        if: ${{ matrix.nom == 'windows' && !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder ${{ matrix.cible }} --publish never

      # Dit noir sur blanc ce qui a ete produit, meme quand une cible a echoue.
      - name: Lister ce qui a été produit
        if: always()
        shell: bash
        run: ls -la release/ 2>/dev/null || echo 'aucun dossier release/'

      # Le guide en PDF, joint a la release : on installe le logiciel sur une
      # machine sans navigateur ouvert a cote. Sur Linux seulement.
      - name: Produire le guide en PDF
        if: ${{ matrix.nom == 'linux' }}
        run: |
          node scripts/publier-guide.mjs
          # --no-sandbox : sur un runner GitHub, chrome-sandbox n'appartient pas
          # a root et n'est pas setuid, et Electron refuse de demarrer plutot que
          # de tourner sans bac a sable. C'est le bon refus par defaut, mais ici
          # la machine ne fait que produire un PDF a partir de notre propre HTML,
          # dans un conteneur jetable : il n'y a rien a isoler de rien.
          xvfb-run --auto-servernum npx electron --no-sandbox scripts/guide-pdf.mjs

      # L'etiquette ne decide de rien : electron-builder lit la version dans
      # package.json. Poser v0.2.1 sur un projet reste en 0.2.0 fait construire
      # une 0.2.0, viser la release v0.2.0 -- deja publiee -- et tout sauter.
      # C'est arrive le 16 aout 2026, et le travail est reste vert.
      - name: L'étiquette doit correspondre à la version du projet
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          etiquette="${GITHUB_REF#refs/tags/v}"
          projet=$(node -p "require('./package.json').version")
          echo "étiquette : $etiquette · package.json : $projet"
          if [ "$etiquette" != "$projet" ]; then
            echo "::error::L'étiquette v$etiquette ne correspond pas à la version $projet de package.json."
            echo "Monter la version dans package.json et dans src/serveur/version.ts, puis reposer l'étiquette."
            exit 1
          fi

      - name: Construire et déposer la release (brouillon)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder ${{ matrix.cible }} --publish always 2>&1 | tee sortie-publication.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # **Le vrai defaut du 16 aout n'etait pas la version, c'etait ce silence.**
      # electron-builder ecrit "skipped publishing" pour chaque fichier, puis
      # sort avec un code nul. Le travail passait au vert sans avoir rien
      # publie. Une verification qui ne peut pas echouer est pire qu'absente.
      - name: Refuser une publication silencieusement sautée
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          if grep -qE "skipped publishing|release not created" sortie-publication.txt; then
            echo "::error::electron-builder a sauté la publication — aucun fichier n'est parti."
            grep -E "skipped publishing|release not created" sortie-publication.txt
            exit 1
          fi
          echo "Publication effectuée, aucun fichier sauté."

      # Les installeurs restent téléchargeables depuis la page du travail
      # pendant 14 jours, même sans release.
      - name: Joindre les installeurs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ohmnia-${{ matrix.nom }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
            release/*guide*.pdf
