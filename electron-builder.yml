appId: ch.colin.ohmnia
productName: Ohmnia
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - build/icon.png
  - package.json
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
linux:
  icon: build/icon.png
  category: Office
  # Un paquet Debian exige un mainteneur avec une adresse e-mail, sinon la
  # construction du .deb echoue. Cette valeur est inscrite dans le paquet et
  # visible de tous ceux qui le telechargent.
  maintainer: Ohmnia <ohmnia@proton.me>
  synopsis: Gestion locale pour indépendants
  description: >-
    Facturation, devis, suivi du temps, inventaire et comptabilité simplifiée.
    Toutes les données restent sur la machine.
  desktop:
    entry:
      Name: Ohmnia
      Comment: Gestion locale pour indépendants
  target:
    # AppImage : un seul fichier exécutable, sans installation, et c'est le
    # seul format Linux que l'auto-updater sait mettre à jour.
    - target: AppImage
      arch:
        - x64
    # deb : pour installer proprement sur Debian et Ubuntu (pas d'auto-update).
    - target: deb
      arch:
        - x64
# Génère `latest.yml` à côté de l'installateur : c'est ce fichier que les autres
# postes lisent pour savoir qu'une nouvelle version existe.
#
# `npm run package:win` construit seulement en local (rien n'est envoyé).
# `npm run publish:win` téléverse en plus sur les GitHub Releases du dépôt
# indiqué ci-dessous — pensez à y mettre le vôtre.
publish:
  - provider: github
    owner: Leimmingz
    repo: ohmnia
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ohmnia
  # Raccourci de désinstallation visible dans le menu Démarrer, en plus de
  # l'entrée dans "Applications et fonctionnalités" de Windows.
  uninstallDisplayName: Ohmnia - Gestion
  deleteAppDataOnUninstall: false
