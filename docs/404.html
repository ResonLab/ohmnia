<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Ohmnia</title>
<meta name="robots" content="noindex">
<script>
(function () {
  try {
    var choix = localStorage.getItem('ohmnia-theme')
    var sombre = choix ? choix === 'sombre'
      : !matchMedia('(prefers-color-scheme: light)').matches
    document.documentElement.setAttribute('data-theme', sombre ? 'sombre' : 'clair')
  } catch (e) { /* private browsing: follow the system setting */ }
})()
</script>
<style>
  :root {
    --bg: #0d1117; --card: #1a2130; --border: rgba(255,255,255,.09);
    --fg: #e7ecf3; --fg-dim: #9aa7b8;
    --grad: linear-gradient(120deg, #1BE7B6, #0E9CD9);
    --radius: 4px; --ease: cubic-bezier(.16, 1, .3, 1);
  }
  :root[data-theme="clair"] {
    --bg: #f6f8fa; --card: #ffffff; --border: rgba(13,17,23,.12);
    --fg: #131a24; --fg-dim: #4e5b6d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    text-align: center; padding: 24px;
  }
  .carte { max-width: 26rem; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 40px; }
  .brand span { font-weight: 600; font-size: 19px; letter-spacing: -.01em; color: var(--fg); }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .14em; color: var(--fg-dim); margin: 0 0 6px; }
  p.grand { font-size: 74px; font-weight: 700; line-height: 1; margin: 0 0 18px; letter-spacing: -.03em; }
  p.texte { color: var(--fg-dim); font-size: 16px; line-height: 1.6; margin: 0 0 32px; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 12px 20px; border-radius: var(--radius); font-weight: 600; font-size: 15px;
    text-decoration: none; transition: filter .3s var(--ease);
  }
  a.btn.plein { background: var(--grad); color: #062b33; }
  a.btn.discret { background: transparent; color: var(--fg); border: 1px solid var(--border); }
  a.btn:hover { filter: brightness(1.08); }
</style>
</head>
<body>
<div class="carte">
  <a class="brand" href="./">
    <svg width="30" height="30" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="ohm-a" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
          <stop stop-color="#1BE7B6"/><stop offset="1" stop-color="#0E9CD9"/>
        </linearGradient>
      </defs>
      <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ohm-a)"/>
      <path d="M20 47c6-3 7.5-7 5-13.5C22.5 26 25 17 32 17s9.5 9 7 16.5C36.5 40 38 44 44 47" stroke="#062B33" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15.5 47h7M41.5 47h7" stroke="#062B33" stroke-width="4.6" stroke-linecap="round"/>
      <circle cx="12" cy="20" r="2.6" fill="#062B33"/>
      <path d="M12 20h6" stroke="#062B33" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="52" cy="20" r="2.6" fill="#062B33"/>
      <path d="M52 20h-6" stroke="#062B33" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <span>Ohmnia</span>
  </a>
  <h1>404 — PAGE NOT FOUND</h1>
  <p class="grand">Nothing here.</p>
  <p class="texte">The page you're looking for doesn't exist, or has moved. Ohmnia itself is unaffected — this is just a stray link.</p>
  <div class="actions">
    <a class="btn plein" href="./">Back to Ohmnia</a>
    <a class="btn discret" href="guide.html">Getting started guide</a>
  </div>
</div>
</body>
</html>
